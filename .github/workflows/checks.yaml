---
name: Checks

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v3

      - name: Show runner info
        run: |
          uname -a
          echo "runner: $RUNNER_OS"
          env | sort

      - name: Test
        run: cd "backend" && docker compose run --rm backend sh -c "python manage.py wait_for_db && python manage.py test"

      - name: Lint
        run: cd "backend" && docker compose run --rm backend sh -c "flake8 app/"