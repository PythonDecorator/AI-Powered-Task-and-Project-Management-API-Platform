---
name: Checks

on:
  push:
  pull_request:

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Show runner info
        run: |
          uname -a
          echo "runner: $RUNNER_OS"
          env | sort

      - name: Test
        run: cd "backend" && docker-compose run --rm backend sh -c "python manage.py wait_for_db && python manage.py test"

      - name: Lint
        run: cd "backend" && docker-compose run --rm backend sh -c "flake8 app/"
